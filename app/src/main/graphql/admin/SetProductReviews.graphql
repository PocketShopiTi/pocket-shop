mutation SetProductReviews($productId: ID!, $reviewIdsJson: String!) {
    metafieldsSet(
        metafields: [
            {
                ownerId: $productId
                namespace: "marketak"
                key: "items"
                type: "list.metaobject_reference"
                value: $reviewIdsJson
            }
        ]
    ) {
        metafields {
            id
            value
        }
        userErrors {
            field
            message
            code
        }
    }
}