query HomeQuery(
    $featuredCount: Int!
    $bestSellerCount: Int!
    $newArrivalCount: Int!
    $brandCount: Int!
) {
    # 1. Brands
    brands: metaobjects(type: "brand", first: $brandCount) {
        nodes {
            id
            handle
            brandName: field(key: "name") { value }
            brandLogo: field(key: "logo") { value }
        }
    }

    # 2. Categories
    categories: metaobjects(type: "cats", first: $brandCount) {
        nodes {
            id
            handle
            catName: field(key: "name") { value }
            catLogo: field(key: "logo") { value }
        }
    }

    # 3. Featured Products
    featuredProducts: products(first: $featuredCount) {
        nodes {
            ...ProductFields
        }
    }

    # 4. Best Sellers
    bestSellers: products(first: $bestSellerCount, sortKey: BEST_SELLING) {
        nodes {
            ...ProductFields
        }
    }

    # 5. New Arrivals
    newArrivals: products(first: $newArrivalCount, sortKey: CREATED_AT, reverse: true) {
        nodes {
            ...ProductFields
        }
    }
}

fragment ProductFields on Product {
    id
    title
    handle
    vendor
    availableForSale

    priceRange {
        minVariantPrice {
            amount
            currencyCode
        }
    }

    compareAtPriceRange {
        maxVariantPrice {
            amount
            currencyCode
        }
    }

    featuredImage {
        url(transform: { maxWidth: 400, maxHeight: 400 })
        altText
    }
}