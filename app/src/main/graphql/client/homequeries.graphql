query HomeQuery(
    $featuredCount: Int!
    $bestSellerCount: Int!
    $newArrivalCount: Int!
    $brandCount: Int!
) {
    # 1. Brands
    brands: metaobjects(type: "brand", first: $brandCount) {
        nodes {
            id
            handle
            brandName: field(key: "name") { value }
            brandLogo: field(key: "logo") { value }
        }
    }

    # 2. Categories
    categories: metaobjects(type: "cats", first: $brandCount) {
        nodes {
            id
            handle
            catName: field(key: "name") { value }
            catLogo: field(key: "logo") { value }
        }
    }

    # 3. Featured Products (Featured collection)
    featured: collection(handle: "featured") {
        products(first: $featuredCount) {
            nodes {
                ...ProductFields
            }
        }
    }

    # 4. Trending (Trending collection)
    bestSellers: collection(handle: "trending") {
        products(first: $bestSellerCount) {
            nodes {
                ...ProductFields
            }
        }
    }

    # 5. New Arrivals (New Arrivals collection, newest first)
    newArrivals: collection(handle: "new-arrivals") {
        products(first: $newArrivalCount, sortKey: CREATED, reverse: true) {
            nodes {
                ...ProductFields
            }
        }
    }
}

fragment ProductFields on Product {
    id
    title
    handle
    vendor
    availableForSale

    priceRange {
        minVariantPrice {
            amount
            currencyCode
        }
    }

    compareAtPriceRange {
        maxVariantPrice {
            amount
            currencyCode
        }
    }

    featuredImage {
        url(transform: { maxWidth: 400, maxHeight: 400 })
        altText
    }
}