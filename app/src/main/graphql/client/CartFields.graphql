fragment CartFields on Cart {
    id
    checkoutUrl
    totalQuantity
    cost {
        subtotalAmount {
            amount
            currencyCode
        }
        totalAmount {
            amount
            currencyCode
        }
    }
    lines(first: 50) {
        edges {
            node {
                id
                quantity
                merchandise {
                    ... on ProductVariant {
                        id
                        title
                        price {
                            amount
                            currencyCode
                        }
                        image {
                            url
                            altText
                        }
                        product {
                            id
                            title
                            handle
                        }
                    }
                }
            }
        }
    }
}
